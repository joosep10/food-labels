<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catering Food Labels — One-off Print</title>
    <style>
      * {
        box-sizing: border-boxs;
      }
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #101010;
        color: #eee;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      button,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        min-height: 40px;
        padding: 9px 14px;
        border: 1px solid #3b3b3b;
        border-radius: 7px;
        background: #202020;
        color: #ddd;
      }
      button:hover:not(:disabled) {
        background: #292929;
        border-color: #4a4a4a;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .app {
        width: min(760px, 100%);
        margin: 0 auto;
        padding: 32px 24px 48px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
        line-height: 1.2;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .intro {
        margin: 0 0 22px;
        color: #888;
        font-size: 14px;
        line-height: 1.5;
      }
      label {
        display: block;
        margin-bottom: 8px;
        color: #bbb;
        font-size: 14px;
        font-weight: 550;
      }
      textarea {
        display: block;
        width: 100%;
        min-height: 300px;
        resize: vertical;
        padding: 13px 14px;
        border: 1px solid #383838;
        border-radius: 8px;
        background: #1b1b1b;
        color: #eee;
        font-size: 15px;
        line-height: 1.6;
        outline: none;
      }
      textarea:focus {
        border-color: #666;
        background: #202020;
      }
      textarea::placeholder {
        color: #777;
      }
      .hint {
        margin: 8px 0 20px;
        color: #777;
        font-size: 13px;
      }
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 18px;
      }
      .language {
        display: none;
        align-items: center;
        gap: 9px;
      }
      .language label {
        margin: 0;
        color: #888;
        font-size: 13px;
      }
      select {
        min-height: 40px;
        padding: 8px 30px 8px 10px;
        border: 1px solid #3b3b3b;
        border-radius: 7px;
        background: #202020;
        color: #ddd;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .primary {
        border-color: #e0e0e0;
        background: #eee;
        color: #111;
      }
      .primary:hover:not(:disabled) {
        background: #fff;
        border-color: #fff;
      }
      .status {
        min-height: 20px;
        margin-top: 16px;
        color: #888;
        font-size: 13px;
      }
      .status.error {
        color: #e07070;
      }
      @media (max-width: 520px) {
        .app {
          padding: 22px 14px 36px;
        }
        h1 {
          font-size: 22px;
        }
        textarea {
          min-height: 240px;
        }
        .actions,
        .language,
        .buttons {
          width: 100%;
        }
        .actions {
          align-items: stretch;
        }
        .language {
          justify-content: flex-start;
        }
        .buttons button {
          flex: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>Catering Food Labels</h1>
      <p class="intro">
        Paste the food names you want to print, one name per line.
      </p>

      <label for="foodNames">Food names</label>
      <textarea
        id="foodNames"
        placeholder="Chicken curry
Roasted vegetables
Potato salad"
        spellcheck="false"
      ></textarea>
      <p class="hint" id="lineCount">0 food names · Blank lines are ignored</p>

      <div class="actions">
        <div class="language">
          <label for="printLanguage">Print:</label>
          <select id="printLanguage">
            <option value="et">Estonian</option>
            <option value="en">English</option>
            <option value="both">Both</option>
          </select>
        </div>
        <div class="buttons">
          <button class="primary" id="generatePdfBtn" type="button">
            Generate PDF
          </button>
          <!--<button id="sendToPrinterBtn" type="button">Send to Printer</button>-->
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
      // The names are only held in this page and are never written to Supabase.
      const SUPABASE_URL = "https://kwmtcmsbpqkssljkhyys.supabase.co";
      const SUPABASE_KEY = "sb_publishable_-KFIl3iWYa-T_7q8AMnVvw_x7DAaZv3";

      const foodNames = document.querySelector("#foodNames");
      const lineCount = document.querySelector("#lineCount");
      const printLanguage = document.querySelector("#printLanguage");
      const generatePdfBtn = document.querySelector("#generatePdfBtn");
      const sendToPrinterBtn = document.querySelector("#sendToPrinterBtn");
      const status = document.querySelector("#status");

      function getFoodsForPrint() {
        return foodNames.value
          .split(/\r?\n/)
          .map((name) => name.trim())
          .filter(Boolean)
          .map((name) => ({ name_et: name, name_en: "" }));
      }

      function updateLineCount() {
        const count = getFoodsForPrint().length;
        lineCount.textContent = `${count} food name${count === 1 ? "" : "s"} · Blank lines are ignored`;
      }

      function setStatus(message, isError = false) {
        status.textContent = message;
        status.className = isError ? "status error" : "status";
      }

      async function submitLabels(action) {
        const foods = getFoodsForPrint();
        if (!foods.length) {
          alert("Paste at least one food name, with one name per line.");
          foodNames.focus();
          return;
        }

        const button =
          action === "download" ? generatePdfBtn : sendToPrinterBtn;
        const originalText =
          action === "download" ? "Generate PDF" : "Send to Printer";
        button.disabled = true;
        button.textContent =
          action === "download" ? "Generating PDF…" : "Sending…";
        setStatus(
          action === "download"
            ? "Generating PDF…"
            : "Sending labels to printer…",
        );

        try {
          const response = await fetch(
            `${SUPABASE_URL}/functions/v1/generate-label-pdf`,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                apikey: SUPABASE_KEY,
                Authorization: `Bearer ${SUPABASE_KEY}`,
              },
              body: JSON.stringify({
                foods,
                language: printLanguage.value,
                action,
              }),
            },
          );

          if (!response.ok) {
            let message =
              action === "download"
                ? "Failed to generate PDF."
                : "Failed to send labels.";
            try {
              const error = await response.json();
              if (error.error) message = error.error;
            } catch {
              /* Response wasn't JSON. */
            }
            throw new Error(message);
          }

          if (action === "download") {
            const now = new Date();

            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, "0");
            const dd = String(now.getDate()).padStart(2, "0");
            const code = String(Math.floor(Math.random() * 1000)).padStart(
              3,
              "0",
            );
            const filename = `${dd}.${mm}.${yy}.${code}.pdf`;
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            setStatus(
              `PDF generated with ${foods.length} food label${foods.length === 1 ? "" : "s"}.`,
            );
          } else {
            await response.json();
            setStatus(
              `Sent ${foods.length} food label${foods.length === 1 ? "" : "s"} successfully.`,
            );
            alert("Labels sent successfully.");
          }
        } catch (error) {
          console.error(error);
          const message =
            error instanceof Error ? error.message : "Something went wrong.";
          setStatus(message, true);
          alert(message);
        } finally {
          button.disabled = false;
          button.textContent = originalText;
        }
      }

      foodNames.addEventListener("input", updateLineCount);
      generatePdfBtn.addEventListener("click", () => submitLabels("download"));
      sendToPrinterBtn.addEventListener("click", () => submitLabels("email"));
      updateLineCount();
    </script>
  </body>
</html>
