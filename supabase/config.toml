
[functions.generate-label-pdf]
enabled = true
verify_jwt = false
import_map = "./functions/generate-label-pdf/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/generate-label-pdf/index.ts"
static_files = [ "./functions/generate-label-pdf/fonts/*.ttf" ]
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/generate-label-pdf/*.html" ]
